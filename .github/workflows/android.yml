# JVM tests and lint on every pull request and push to main.
#
# content/ is the private Circiii/fonia-content repository, owned by a personal account. A fine-grained token
# cannot reach another user's repository even for a collaborator, so CONTENT_TOKEN is a classic token with the
# repo scope, made by a collaborator on fonia-content. It expires: renew it in both repositories' secrets. The speech
# models are downloaded and SHA-256 checked by the build into ~/.gradle/fonia-models, cached here by
# spec/models/manifest.json. Parakeet-Ro is not downloadable, so CI builds without it, as any machine without
# the file does.
name: android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository comes with the workflow's own token; CONTENT_TOKEN is used for the content submodule
      # alone and is passed with -c, so it is never written to a git config.
      - name: Fetch submodules
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: >-
          git -c "url.https://x-access-token:${CONTENT_TOKEN}@github.com/Circiii/fonia-content.insteadOf=https://github.com/Circiii/fonia-content"
          submodule update --init --recursive
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/fonia-models
          key: fonia-models-${{ hashFiles('spec/models/manifest.json') }}
      - run: ./gradlew unitTests --continue
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Spotless checks only the files changed since origin/main, so it needs that history.
          fetch-depth: 0
      - name: Fetch submodules
        env:
          CONTENT_TOKEN: ${{ secrets.CONTENT_TOKEN }}
        run: >-
          git -c "url.https://x-access-token:${CONTENT_TOKEN}@github.com/Circiii/fonia-content.insteadOf=https://github.com/Circiii/fonia-content"
          submodule update --init --recursive
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/fonia-models
          key: fonia-models-${{ hashFiles('spec/models/manifest.json') }}
      # Linting :platform:ml packs the models into its assets, and that step only copies from the cache.
      - name: Fetch the required models
        shell: python3 {0}
        run: |
          import hashlib, json, pathlib, urllib.request
          cache = pathlib.Path.home() / ".gradle/fonia-models"
          for model in json.load(open("spec/models/manifest.json"))["models"]:
              target = cache / model["cache"]
              if model.get("optional") or target.is_file():
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              partial = target.with_suffix(".part")
              urllib.request.urlretrieve(model["source"], partial)
              data = partial.read_bytes()
              if len(data) != model["bytes"] or hashlib.sha256(data).hexdigest() != model["sha256"]:
                  raise SystemExit(f"{model['id']}: size or SHA-256 does not match the manifest")
              partial.rename(target)
      - run: ./gradlew spotlessCheck lintDebug --continue
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          retention-days: 7
